<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Pink Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            background-color: #2d1b2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            position: relative;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.03),
                rgba(0,0,0,0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 100;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            box-shadow: 
                4px 0 0 #fff, 8px 0 0 #fff,
                0 4px 0 #fff, 0 8px 0 #fff,
                -4px 0 0 #fff, -8px 0 0 #fff,
                0 -4px 0 #fff, 0 -8px 0 #fff;
            animation: twinkle 2s infinite;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 22%; right: 12%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 18%; left: 12%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 28%; right: 18%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { top: 50%; left: 5%; animation-delay: 0.3s; }
        .sparkle:nth-child(6) { top: 60%; right: 5%; animation-delay: 0.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* Floating hearts */
        .deco {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
        }

        .deco svg {
            display: block;
        }

        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(3deg); }
            50% { transform: translateY(-15px) rotate(-3deg); }
        }
        @keyframes float3 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.05); }
        }
        @keyframes float4 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-12px) rotate(5deg); }
            66% { transform: translateY(8px) rotate(-5deg); }
        }

        .heart-deco1 { top: 6%; left: 6%; animation: float1 4s ease-in-out infinite; }
        .heart-deco2 { top: 4%; right: 6%; animation: float2 5s ease-in-out infinite; animation-delay: 1s; }
        .heart-deco3 { bottom: 10%; left: 6%; animation: float3 3.5s ease-in-out infinite; }
        .heart-deco4 { bottom: 12%; right: 8%; animation: float4 4.5s ease-in-out infinite; animation-delay: 1s; }
        .heart-deco5 { top: 42%; left: 2%; animation: float2 5.5s ease-in-out infinite; animation-delay: 0.5s; }
        .heart-deco6 { top: 48%; right: 2%; animation: float1 4s ease-in-out infinite; animation-delay: 1.5s; }

        /* Calculator */
        .calculator {
            background-color: #ff69b4;
            padding: 24px;
            border: 4px solid #000;
            box-shadow: 
                8px 8px 0 #000,
                inset -4px -4px 0 #d1478c,
                inset 4px 4px 0 #ffb6d5;
            position: relative;
            z-index: 10;
        }

        .calculator::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 2px solid #000;
            pointer-events: none;
        }

        .display {
            background-color: #c4cfa1;
            border: 4px solid #000;
            padding: 16px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            box-shadow: inset 4px 4px 0 #8b956d;
        }

        .display-history {
            font-size: 10px;
            color: #5a6348;
            margin-bottom: 8px;
            min-height: 12px;
        }

        .display-main {
            font-size: 24px;
            color: #2d1b2e;
            letter-spacing: 2px;
            word-break: break-all;
            text-shadow: 1px 1px 0 #8b956d;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 64px);
            grid-template-rows: repeat(5, 64px);
            gap: 12px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            border: 4px solid #000;
            cursor: pointer;
            position: relative;
            background-color: #e0e0e0;
            color: #2d1b2e;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.05s, box-shadow 0.05s;
            image-rendering: pixelated;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-num {
            background-color: #b8c5d6;
            box-shadow: 4px 4px 0 #000, inset -2px -2px 0 #8a9bb0, inset 2px 2px 0 #dde5ee;
        }

        .btn-op {
            background-color: #a8b5c6;
            box-shadow: 4px 4px 0 #000, inset -2px -2px 0 #7a8ba0, inset 2px 2px 0 #cdd5e6;
        }

        .btn-clear {
            background-color: #d4a5a5;
            box-shadow: 4px 4px 0 #000, inset -2px -2px 0 #a67a7a, inset 2px 2px 0 #e8cccc;
        }

        .btn-eq {
            background-color: #ff8c42;
            color: #fff;
            box-shadow: 4px 4px 0 #000, inset -2px -2px 0 #cc6b2f, inset 2px 2px 0 #ffb380;
        }

        .btn-0 {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- Hearts -->
    <div class="deco heart-deco1" id="heart1"></div>
    <div class="deco heart-deco2" id="heart2"></div>
    <div class="deco heart-deco3" id="heart3"></div>
    <div class="deco heart-deco4" id="heart4"></div>
    <div class="deco heart-deco5" id="heart5"></div>
    <div class="deco heart-deco6" id="heart6"></div>

    <div class="calculator">
        <div class="display">
            <div class="display-history" id="history"></div>
            <div class="display-main" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearAll()">C</button>
            <button class="btn-clear" onclick="clearEntry()">CE</button>
            <button class="btn-op" onclick="appendOp('%')">%</button>
            <button class="btn-op" onclick="appendOp('/')">÷</button>

            <button class="btn-num" onclick="appendNum('7')">7</button>
            <button class="btn-num" onclick="appendNum('8')">8</button>
            <button class="btn-num" onclick="appendNum('9')">9</button>
            <button class="btn-op" onclick="appendOp('*')">×</button>

            <button class="btn-num" onclick="appendNum('4')">4</button>
            <button class="btn-num" onclick="appendNum('5')">5</button>
            <button class="btn-num" onclick="appendNum('6')">6</button>
            <button class="btn-op" onclick="appendOp('-')">−</button>

            <button class="btn-num" onclick="appendNum('1')">1</button>
            <button class="btn-num" onclick="appendNum('2')">2</button>
            <button class="btn-num" onclick="appendNum('3')">3</button>
            <button class="btn-op" onclick="appendOp('+')">+</button>

            <button class="btn-num btn-0" onclick="appendNum('0')">0</button>
            <button class="btn-num" onclick="appendNum('.')">.</button>
            <button class="btn-eq" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        function renderPixelArt(containerId, map, colors, pixelSize = 5) {
            const container = document.getElementById(containerId);
            const height = map.length;
            const width = map[0].length;
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            svg.setAttribute('width', width * pixelSize);
            svg.setAttribute('height', height * pixelSize);
            svg.style.display = 'block';
            svg.style.shapeRendering = 'crispEdges';
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const char = map[y][x];
                    if (colors[char]) {
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', x);
                        rect.setAttribute('y', y);
                        rect.setAttribute('width', 1);
                        rect.setAttribute('height', 1);
                        rect.setAttribute('fill', colors[char]);
                        svg.appendChild(rect);
                    }
                }
            }
            container.appendChild(svg);
        }

        const heartMap = [
            '...RR...RR...',
            '..RRRR.RRRR..',
            '.RRRRRRRRRRR.',
            'RRHHHHHHHHHRR',
            'RRHHHHWHHHHRR',
            '.RHHHHHHHHHR.',
            '..RHHHHHHHR..',
            '...RHHHHHR...',
            '....RHHHR....',
            '.....RHR.....',
            '......R......'
        ];
        const heartColors = {
            'R': '#e91e63',
            'H': '#ff69b4',
            'W': '#ffffff'
        };

        renderPixelArt('heart1', heartMap, heartColors, 5);
        renderPixelArt('heart2', heartMap, heartColors, 4);
        renderPixelArt('heart3', heartMap, heartColors, 6);
        renderPixelArt('heart4', heartMap, heartColors, 4);
        renderPixelArt('heart5', heartMap, heartColors, 5);
        renderPixelArt('heart6', heartMap, heartColors, 4);

        let current = '0';
        let history = '';
        let shouldReset = false;

        const display = document.getElementById('display');
        const historyDisplay = document.getElementById('history');

        function updateDisplay() {
            display.textContent = current.slice(0, 10) || '0';
            historyDisplay.textContent = history.slice(0, 20);
        }

        function appendNum(num) {
            if (shouldReset) {
                current = '';
                shouldReset = false;
            }
            if (current === '0' && num !== '.') {
                current = num;
            } else {
                if (num === '.' && current.includes('.')) return;
                current += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (shouldReset) shouldReset = false;
            history = current + ' ' + op;
            current = '0';
            updateDisplay();
        }

        function clearAll() {
            current = '0';
            history = '';
            updateDisplay();
        }

        function clearEntry() {
            current = '0';
            updateDisplay();
        }

        function calculate() {
            try {
                const expr = history.replace('×', '*').replace('−', '-').replace('÷', '/') + ' ' + current;
                const result = eval(expr.replace(/[^0-9+\-*/.%]/g, ''));
                current = String(parseFloat(result.toFixed(8)));
                history = '';
                shouldReset = true;
                updateDisplay();
            } catch (e) {
                current = 'ERR';
                shouldReset = true;
                updateDisplay();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            if (e.key === '.') appendNum('.');
            if (e.key === '+') appendOp('+');
            if (e.key === '-') appendOp('-');
            if (e.key === '*') appendOp('*');
            if (e.key === '/') appendOp('/');
            if (e.key === '%') appendOp('%');
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearAll();
            if (e.key === 'Backspace') {
                current = current.slice(0, -1) || '0';
                updateDisplay();
            }
        });
    </script>
</body>
</html>
